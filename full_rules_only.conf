# OpenClash full：仅统一策略组与分流规则，不包含节点或订阅
# 适用于支持 [YAML] 与 ! 替换语法的 OpenClash 覆写模块功能
# 节点由 node_sources.conf 的 proxy-providers 提供；不包含节点凭据
# 请勿作为 Mihomo 原生配置文件直接加载
[YAML]

# ------------------------------------------------------------
# 策略组
# ------------------------------------------------------------
proxy-groups!:

  # 全局默认代理出口
  - name: "🚀 PROXY"
    type: select
    proxies:
      - "⚡ AUTO"
      - "💻 DEV"
      - "🤖 AI"
      - "🔍 GOOGLE"
      - "🪟 MICROSOFT"
      - "✈️ TELEGRAM"
      - "🎬 STREAM"
      - "🎮 GAME"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇹🇼 TW"
      - "🇺🇸 US"
      - "🇫🇷 FR"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # 所有订阅节点自动测速
  - name: "⚡ AUTO"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  # 全部节点手动选择
  - name: "🌍 GLOBAL"
    type: select
    include-all: true
    proxies:
      - "DIRECT"

  # 地区节点池
  - name: "🇭🇰 HK"
    type: url-test
    include-all: true
    filter: "(?i)(港|hk|hong[ -]?kong)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇯🇵 JP"
    type: url-test
    include-all: true
    filter: "(?i)(日|jp|japan|tokyo|osaka)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇸🇬 SG"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|sg|singapore)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇹🇼 TW"
    type: url-test
    include-all: true
    filter: "(?i)(台|tw|taiwan)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇺🇸 US"
    type: url-test
    include-all: true
    filter: "(?i)(美|us|united[ -]?states|america|los[ -]?angeles|san[ -]?jose|seattle|silicon[ -]?valley)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇫🇷 FR"
    type: url-test
    include-all: true
    # 单引号：YAML 双引号里的 \b 会被转成退格符；\bfr\b 避免误收 Frankfurt 等
    filter: '(?i)(法国|法國|巴黎|\bfr\b|france|paris)'
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # GitHub、Docker、软件包、代码托管
  - name: "💻 DEV"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # OpenAI、Claude、Gemini 等
  - name: "🤖 AI"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
    include-all: true

  # Google / YouTube
  - name: "🔍 GOOGLE"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # YouTube 均摊：每个订阅先各自选一个节点，再在订阅之间按连接轮转
  # 这三个组全部用 use: 引入 provider，组级 url/interval 不生效，
  # 测速周期由 node_sources.conf 里 provider 的 health-check.interval 决定。
  # use: 引用的 provider 必须真实存在于 node_sources.conf，否则内核启动失败。
  - name: "📺 YT-1"
    type: url-test
    use: ["airport_1"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-2"
    type: url-test
    use: ["airport_2"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-3"
    type: url-test
    use: ["airport_3"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-4"
    type: url-test
    use: ["airport_4"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-5"
    type: url-test
    use: ["airport_5"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-6"
    type: url-test
    use: ["airport_6"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-7"
    type: url-test
    use: ["airport_7"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-8"
    type: url-test
    use: ["airport_8"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-9"
    type: url-test
    use: ["airport_9"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  - name: "📺 YT-10"
    type: url-test
    use: ["airport_10"]
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  # 若 YouTube 播放出现中断，可加 disable-udp: true 强制回落 TCP/HTTP2
  # 均摊粒度是「连接」而非字节：一条连接的整个生命周期固定在一个订阅上。
  # 若 YouTube 走 QUIC(HTTP/3/UDP)，整条 QUIC 会话会被当成一个 UDP 连接，
  # 视频字节将 100% 压在单一订阅上，轮转完全失效。
  # 这里禁用 UDP，强制回落 TCP/HTTP2，让多连接轮转始终有发挥空间。
  # 若画质劣化明显，删掉这一行即可回退。
  - name: "📺 YT-LB"
    type: load-balance
    strategy: round-robin
    disable-udp: true
    proxies: ["📺 YT-1", "📺 YT-2", "📺 YT-3", "📺 YT-4", "📺 YT-5", "📺 YT-6", "📺 YT-7", "📺 YT-8", "📺 YT-9", "📺 YT-10"]

  # 订阅全灭时的兜底：只用自建节点，不掺进任何 YT-N，故不影响上面的均摊分布
  - name: "📺 YT-MANUAL"
    type: url-test
    use: ["manual_nodes"]
    disable-udp: true
    max-failed-times: 2
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  # 兜底链：正常走 10 订阅轮转；仅当 10 个订阅全部失效时才落到自建节点。
  # 分流规则的出口指向这一层，而不是直接指向 YT-LB。
  - name: "📺 YT"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies: ["📺 YT-LB", "📺 YT-MANUAL"]

  # Microsoft / Azure / VS Code / Copilot
  - name: "🪟 MICROSOFT"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # Telegram
  - name: "✈️ TELEGRAM"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
    include-all: true

  # 流媒体：建议在 LuCI 中手动选择实际可解锁的地区节点
  - name: "🎬 STREAM"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇭🇰 HK"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # 游戏：默认直连，必要时切换至相应地区节点
  - name: "🎮 GAME"
    type: select
    proxies:
      - "DIRECT"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
    include-all: true

  # Apple/iCloud：默认直连
  - name: "🍎 APPLE"
    type: select
    proxies:
      - "DIRECT"
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
    include-all: true

  # 中国大陆：默认直连
  - name: "🏠 CN"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 PROXY"

# ------------------------------------------------------------
# 远程规则集
#
# 上游 Loyalsoldier/clash-rules 的 release/*.txt 是 payload:
# 开头的 YAML 格式（domain 组为域名、ipcidr 组为网段），
# 所以这里必须用 format: yaml；写成 text 会逐行当字面量，规则全部不命中。
# path 的 .yaml 后缀只是本地落地文件名，与 URL 无关。
# ------------------------------------------------------------
rule-providers:

  reject:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/reject.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"

  private:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/private.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"

  icloud:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/icloud.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"

  apple:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/apple.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"

  google:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/google.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt"

  proxy:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/proxy.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"

  direct:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: "./ruleset/direct.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

  cncidr:
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
    path: "./ruleset/cncidr.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"

  telegramcidr:
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
    path: "./ruleset/telegramcidr.yaml"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"

# ------------------------------------------------------------
# 分流规则
# 规则从上到下匹配，最后由 MATCH 兜底
# ------------------------------------------------------------
rules!:

  # 广告、跟踪、已知拦截域名
  - "RULE-SET,reject,REJECT"

  # 本机、私有地址、LAN：必须优先直连，防止旁路由回环
  - "IP-CIDR,0.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,240.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR6,::1/128,DIRECT,no-resolve"
  - "IP-CIDR6,fc00::/7,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"

  # 当前 LAN 网段；如不是 192.168.10.0/24，请替换
  - "IP-CIDR,192.168.10.0/24,DIRECT,no-resolve"

  # 私有域名、家庭/局域网域名
  - "RULE-SET,private,DIRECT"

  # Apple / iCloud
  - "RULE-SET,icloud,🍎 APPLE"
  - "RULE-SET,apple,🍎 APPLE"

  # AI：优先于通用 Google / Proxy 规则
  - "DOMAIN-SUFFIX,openai.com,🤖 AI"
  - "DOMAIN-SUFFIX,chatgpt.com,🤖 AI"
  - "DOMAIN-SUFFIX,oaistatic.com,🤖 AI"
  - "DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI"
  - "DOMAIN-SUFFIX,anthropic.com,🤖 AI"
  - "DOMAIN-SUFFIX,claude.ai,🤖 AI"
  - "DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI"
  - "DOMAIN,gemini.google.com,🤖 AI"
  - "DOMAIN,ai.google.dev,🤖 AI"
  - "DOMAIN,generativelanguage.googleapis.com,🤖 AI"

  # GitHub / GitHub API / GHCR
  - "DOMAIN-SUFFIX,github.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubusercontent.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubassets.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubapp.com,💻 DEV"
  - "DOMAIN-SUFFIX,github.io,💻 DEV"
  - "DOMAIN-SUFFIX,githubstatus.com,💻 DEV"
  - "DOMAIN-SUFFIX,ghcr.io,💻 DEV"

  # Docker / OCI
  - "DOMAIN-SUFFIX,docker.com,💻 DEV"
  - "DOMAIN-SUFFIX,docker.io,💻 DEV"
  - "DOMAIN-SUFFIX,dockerusercontent.com,💻 DEV"
  - "DOMAIN,registry-1.docker.io,💻 DEV"
  - "DOMAIN-SUFFIX,quay.io,💻 DEV"

  # 开发和包管理服务
  - "DOMAIN-SUFFIX,npmjs.com,💻 DEV"
  - "DOMAIN,registry.npmjs.org,💻 DEV"
  - "DOMAIN-SUFFIX,yarnpkg.com,💻 DEV"
  - "DOMAIN,registry.yarnpkg.com,💻 DEV"
  - "DOMAIN-SUFFIX,pypi.org,💻 DEV"
  - "DOMAIN-SUFFIX,pythonhosted.org,💻 DEV"
  - "DOMAIN-SUFFIX,files.pythonhosted.org,💻 DEV"
  - "DOMAIN-SUFFIX,rubygems.org,💻 DEV"
  - "DOMAIN-SUFFIX,packagist.org,💻 DEV"
  - "DOMAIN-SUFFIX,crates.io,💻 DEV"
  - "DOMAIN-SUFFIX,maven.org,💻 DEV"
  - "DOMAIN-SUFFIX,repo.maven.apache.org,💻 DEV"
  - "DOMAIN-SUFFIX,gradle.org,💻 DEV"
  - "DOMAIN-SUFFIX,go.dev,💻 DEV"
  - "DOMAIN,proxy.golang.org,💻 DEV"
  - "DOMAIN-SUFFIX,golang.org,💻 DEV"
  - "DOMAIN-SUFFIX,gitlab.com,💻 DEV"
  - "DOMAIN-SUFFIX,bitbucket.org,💻 DEV"
  - "DOMAIN-SUFFIX,sourceforge.net,💻 DEV"
  - "DOMAIN-SUFFIX,jetbrains.com,💻 DEV"

  # 国内开发镜像直连
  - "DOMAIN-SUFFIX,npmmirror.com,DIRECT"
  - "DOMAIN-SUFFIX,registry.npmmirror.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.aliyun.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.cloud.tencent.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.ustc.edu.cn,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.tuna.tsinghua.edu.cn,DIRECT"

  # YouTube：必须排在 RULE-SET,google 之前，
  # 否则上游规则集一旦收录 YouTube 域名，下面这几条就成了死规则
  - "DOMAIN-SUFFIX,youtube.com,📺 YT"
  - "DOMAIN-SUFFIX,youtube-nocookie.com,📺 YT"
  - "DOMAIN-SUFFIX,youtu.be,📺 YT"
  - "DOMAIN-SUFFIX,googlevideo.com,📺 YT"
  - "DOMAIN-SUFFIX,ytimg.com,📺 YT"
  - "DOMAIN-SUFFIX,ggpht.com,📺 YT"

  # Google
  # 上游 google.txt 不含 google.com 顶级域本身（只有子域名），
  # 所以 apex 流量会一路漏到 RULE-SET,proxy；这里显式补上。
  # 放在 RULE-SET,google 之前才会生效，且不影响前面的 gemini.google.com → 🤖 AI。
  - "DOMAIN-SUFFIX,google.com,🔍 GOOGLE"
  # 同理：googleapis.com 的顶级域也不在上游规则集里，
  # 上面的 generativelanguage.googleapis.com 是更靠前的 exact 规则，仍归 🤖 AI。
  - "DOMAIN-SUFFIX,googleapis.com,🔍 GOOGLE"
  - "RULE-SET,google,🔍 GOOGLE"

  # Microsoft / Azure / VS Code / GitHub Copilot
  - "DOMAIN-SUFFIX,microsoft.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,microsoftonline.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,live.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,office.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,office365.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,windows.net,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,azure.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,azureedge.net,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,visualstudio.com,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,vsassets.io,🪟 MICROSOFT"
  - "DOMAIN-SUFFIX,githubcopilot.com,🪟 MICROSOFT"

  # Telegram：域名和 IP 网段
  - "DOMAIN-SUFFIX,telegram.org,✈️ TELEGRAM"
  - "DOMAIN-SUFFIX,t.me,✈️ TELEGRAM"
  - "DOMAIN-SUFFIX,tdesktop.com,✈️ TELEGRAM"
  - "RULE-SET,telegramcidr,✈️ TELEGRAM"

  # 流媒体
  - "DOMAIN-SUFFIX,netflix.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,nflxvideo.net,🎬 STREAM"
  - "DOMAIN-SUFFIX,nflximg.net,🎬 STREAM"
  - "DOMAIN-SUFFIX,nflxso.net,🎬 STREAM"
  - "DOMAIN-SUFFIX,disneyplus.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,dssott.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,max.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,hulu.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,primevideo.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,spotify.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,scdn.co,🎬 STREAM"
  - "DOMAIN-SUFFIX,tiktok.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,tiktokv.com,🎬 STREAM"
  - "DOMAIN-SUFFIX,tiktokcdn.com,🎬 STREAM"

  # 游戏
  - "DOMAIN-SUFFIX,steampowered.com,🎮 GAME"
  - "DOMAIN-SUFFIX,steamcommunity.com,🎮 GAME"
  - "DOMAIN-SUFFIX,steamstatic.com,🎮 GAME"
