# ============================================================
# OpenClash / Mihomo 多订阅统一分流 - 精简版
#
# 用途：
# - 多订阅节点统一进入本地策略组
# - GitHub、Docker、开发依赖、AI 服务按组分流
# - 面向 OpenWrt 旁路由 + Linux Server
#
# 注意：
# - 本文件用于 OpenClash「自定义覆写 YAML」
# - 不要直接覆盖订阅 YAML
# ============================================================

# ------------------------------------------------------------
# 基本运行项
# ------------------------------------------------------------
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# 可选：若使用 Clash Dashboard/API 才需要
# 不要从 WAN 放行 9090 端口
external-controller: "0.0.0.0:9090"
secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

# ------------------------------------------------------------
# 多订阅统一策略组
# ------------------------------------------------------------
proxy-groups:

  # 默认出口：绝大多数代理规则指向此组
  - name: "🚀 PROXY"
    type: select
    proxies:
      - "⚡ AUTO"
      - "💻 DEV"
      - "🤖 AI"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # 全订阅节点自动测速
  # 不要添加 DIRECT，否则直连通常会因低延迟被选中
  - name: "⚡ AUTO"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  # 全节点手动选节点
  - name: "🌍 GLOBAL"
    type: select
    include-all: true
    proxies:
      - "DIRECT"

  # 香港节点：通过节点名筛选
  - name: "🇭🇰 HK"
    type: url-test
    include-all: true
    filter: "(?i)(港|hk|hong[ -]?kong)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # 日本节点
  - name: "🇯🇵 JP"
    type: url-test
    include-all: true
    filter: "(?i)(日|jp|japan|tokyo|osaka)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # 新加坡节点
  - name: "🇸🇬 SG"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|sg|singapore)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # 美国节点
  - name: "🇺🇸 US"
    type: url-test
    include-all: true
    filter: "(?i)(美|us|united[ -]?states|america|los[ -]?angeles|san[ -]?jose|seattle|silicon[ -]?valley)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # 开发工具专用：GitHub、Docker、npm、PyPI 等
  - name: "💻 DEV"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # AI 专用：建议手动选已验证可用的美国/日本/新加坡节点
  - name: "🤖 AI"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
    include-all: true

# ------------------------------------------------------------
# 精简分流规则
# 按顺序匹配；MATCH 必须始终在最后
# ------------------------------------------------------------
rules:

  # 局域网、回环和私有地址直连
  - "IP-CIDR,0.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,240.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR6,::1/128,DIRECT,no-resolve"
  - "IP-CIDR6,fc00::/7,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"

  # 你的旁路由 LAN 网段；若不同则替换
  - "IP-CIDR,192.168.10.0/24,DIRECT,no-resolve"

  # GitHub / GitHub API / GitHub Releases / GHCR
  - "DOMAIN-SUFFIX,github.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubusercontent.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubassets.com,💻 DEV"
  - "DOMAIN-SUFFIX,githubapp.com,💻 DEV"
  - "DOMAIN-SUFFIX,github.io,💻 DEV"
  - "DOMAIN-SUFFIX,ghcr.io,💻 DEV"
  - "DOMAIN-SUFFIX,githubstatus.com,💻 DEV"

  # Docker / OCI Registry
  - "DOMAIN-SUFFIX,docker.com,💻 DEV"
  - "DOMAIN-SUFFIX,docker.io,💻 DEV"
  - "DOMAIN-SUFFIX,dockerusercontent.com,💻 DEV"
  - "DOMAIN,registry-1.docker.io,💻 DEV"
  - "DOMAIN-SUFFIX,quay.io,💻 DEV"

  # 常见开发与包管理服务
  - "DOMAIN-SUFFIX,npmjs.com,💻 DEV"
  - "DOMAIN,registry.npmjs.org,💻 DEV"
  - "DOMAIN-SUFFIX,yarnpkg.com,💻 DEV"
  - "DOMAIN,registry.yarnpkg.com,💻 DEV"
  - "DOMAIN-SUFFIX,pypi.org,💻 DEV"
  - "DOMAIN-SUFFIX,pythonhosted.org,💻 DEV"
  - "DOMAIN-SUFFIX,files.pythonhosted.org,💻 DEV"
  - "DOMAIN-SUFFIX,rubygems.org,💻 DEV"
  - "DOMAIN-SUFFIX,packagist.org,💻 DEV"
  - "DOMAIN-SUFFIX,crates.io,💻 DEV"
  - "DOMAIN-SUFFIX,repo.maven.apache.org,💻 DEV"
  - "DOMAIN-SUFFIX,maven.org,💻 DEV"
  - "DOMAIN-SUFFIX,gradle.org,💻 DEV"
  - "DOMAIN-SUFFIX,go.dev,💻 DEV"
  - "DOMAIN,proxy.golang.org,💻 DEV"
  - "DOMAIN-SUFFIX,golang.org,💻 DEV"
  - "DOMAIN-SUFFIX,gitlab.com,💻 DEV"
  - "DOMAIN-SUFFIX,bitbucket.org,💻 DEV"
  - "DOMAIN-SUFFIX,sourceforge.net,💻 DEV"
  - "DOMAIN-SUFFIX,jetbrains.com,💻 DEV"

  # 常见国内开发镜像直连
  - "DOMAIN-SUFFIX,npmmirror.com,DIRECT"
  - "DOMAIN-SUFFIX,registry.npmmirror.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.aliyun.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.cloud.tencent.com,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.ustc.edu.cn,DIRECT"
  - "DOMAIN-SUFFIX,mirrors.tuna.tsinghua.edu.cn,DIRECT"

  # OpenAI / ChatGPT / Codex
  - "DOMAIN-SUFFIX,openai.com,🤖 AI"
  - "DOMAIN-SUFFIX,chatgpt.com,🤖 AI"
  - "DOMAIN-SUFFIX,oaistatic.com,🤖 AI"
  - "DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI"

  # Anthropic / Claude
  - "DOMAIN-SUFFIX,anthropic.com,🤖 AI"
  - "DOMAIN-SUFFIX,claude.ai,🤖 AI"
  - "DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI"

  # Google Gemini API 和 Gemini Web
  - "DOMAIN,gemini.google.com,🤖 AI"
  - "DOMAIN,ai.google.dev,🤖 AI"
  - "DOMAIN,generativelanguage.googleapis.com,🤖 AI"

  # 兜底规则：未匹配流量走默认代理
  - "MATCH,🚀 PROXY"