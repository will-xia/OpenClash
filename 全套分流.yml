# ============================================================
# OpenClash / Mihomo 多订阅统一分流 - 全套版
#
# 特点：
# - 多订阅统一策略组
# - 开发、AI、Google、微软、Telegram、流媒体、游戏独立出口
# - 使用远程 text 格式规则集
# - 国内域名与中国大陆 IP 默认直连
#
# 注意：
# - 本文件用于 OpenClash「自定义覆写 YAML」
# - 第一次启用时请观察 OpenClash 日志中的规则集下载状态
# ============================================================

# ------------------------------------------------------------
# 基本运行项
# ------------------------------------------------------------
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# 可选：仅允许 LAN 访问，禁止从 WAN 放行 9090
external-controller: "0.0.0.0:9090"
secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

# ------------------------------------------------------------
# 策略组
# ------------------------------------------------------------
proxy-groups:

  # 全局默认代理出口
  - name: "🚀 PROXY"
    type: select
    proxies:
      - "⚡ AUTO"
      - "💻 DEV"
      - "🤖 AI"
      - "🔍 GOOGLE"
      - "🪟 MICROSOFT"
      - "✈️ TELEGRAM"
      - "🎬 STREAM"
      - "🎮 GAME"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇹🇼 TW"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # 所有订阅节点自动测速
  - name: "⚡ AUTO"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true
    exclude-filter: "(?i)(剩余|到期|官网|流量|套餐|续费|客服|公告|更新|订阅|test)"

  # 全部节点手动选择
  - name: "🌍 GLOBAL"
    type: select
    include-all: true
    proxies:
      - "DIRECT"

  # 地区节点池
  - name: "🇭🇰 HK"
    type: url-test
    include-all: true
    filter: "(?i)(港|hk|hong[ -]?kong)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇯🇵 JP"
    type: url-test
    include-all: true
    filter: "(?i)(日|jp|japan|tokyo|osaka)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇸🇬 SG"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|sg|singapore)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇹🇼 TW"
    type: url-test
    include-all: true
    filter: "(?i)(台|tw|taiwan)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  - name: "🇺🇸 US"
    type: url-test
    include-all: true
    filter: "(?i)(美|us|united[ -]?states|america|los[ -]?angeles|san[ -]?jose|seattle|silicon[ -]?valley)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: true

  # GitHub、Docker、软件包、代码托管
  - name: "💻 DEV"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # OpenAI、Claude、Gemini 等
  - name: "🤖 AI"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
    include-all: true

  # Google / YouTube
  - name: "🔍 GOOGLE"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # Microsoft / Azure / VS Code / Copilot
  - name: "🪟 MICROSOFT"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # Telegram
  - name: "✈️ TELEGRAM"
    type: select
    proxies:
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
    include-all: true

  # 流媒体：建议在 LuCI 中手动选择实际可解锁的地区节点
  - name: "🎬 STREAM"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇭🇰 HK"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
      - "DIRECT"
    include-all: true

  # 游戏：默认直连，必要时切换至相应地区节点
  - name: "🎮 GAME"
    type: select
    proxies:
      - "DIRECT"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇸🇬 SG"
      - "🇺🇸 US"
      - "⚡ AUTO"
      - "🌍 GLOBAL"
    include-all: true

  # Apple/iCloud：默认直连
  - name: "🍎 APPLE"
    type: select
    proxies:
      - "DIRECT"
      - "⚡ AUTO"
      - "🇭🇰 HK"
      - "🇯🇵 JP"
      - "🇺🇸 US"
      - "🌍 GLOBAL"
    include-all: true

  # 中国大陆：默认直连
  - name: "🏠 CN"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 PROXY"

# ------------------------------------------------------------
# 远程规则集
#
# format: text：
# - 规则文件为纯文本，每行一条规则或匹配项
# - 与 .txt 规则源匹配
# - 与 format: yaml 不可混用
# ------------------------------------------------------------
rule-providers:

  reject:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/reject.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"

  private:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/private.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"

  icloud:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/icloud.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"

  apple:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/apple.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"

  google:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/google.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt"

  proxy:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/proxy.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"

  direct:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: "./ruleset/direct.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

  cncidr:
    type: http
    behavior: ipcidr
    format: text
    interval: 86400
    path: "./ruleset/cncidr.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"

  telegramcidr:
    type: http
    behavior: ipcidr
    format: text
    interval: 86400
    path: "./ruleset/telegramcidr.txt"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"

# ------------------------------------------------------------
# 分流规则
# 规则从上到下匹配，最后由 MATCH 兜底
# ------------------------------------------------------------
rules:

  # 广告、跟踪、已知拦截域名
  - "RULE-SET,reject,REJECT"

  # 本机、私有地址、LAN：必须优先直连，防止旁路由回环
  - "IP-CIDR,0.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,240.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR6,::1/128,DIRECT,no-resolve"
  - "IP-CIDR6,fc00::/7,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"

  # 当前 LAN 网段；如不是 192.168.10.0/24，请替换
  - "IP-CIDR,192.168.10.0/24,DIRECT,no-resolve"

  # 私有域名、家庭/局域网域名
  - "RULE-SET,private,DIRECT"

  # Apple / iCloud
  - "RULE-SET,icloud,🍎 APPLE"
  - "RULE-SET,apple,🍎 APPLE"

  # AI：优先于通用 Google / Proxy 规则
